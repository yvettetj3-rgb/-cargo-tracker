<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отслеживание посылки</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 500px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; margin-bottom: 8px; }
        .header p { color: var(--tg-theme-hint-color, #999); font-size: 14px; }
        .search-box {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            border: 2px solid var(--tg-theme-hint-color, #ddd);
            border-radius: 12px;
            background: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        button {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #fff);
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        .result {
            display: none;
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 16px;
            padding: 20px;
        }
        .result.show { display: block; }
        .track-code {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--tg-theme-button-color, #2481cc);
        }
        .description {
            font-size: 16px;
            margin-bottom: 20px;
        }
        .timeline { position: relative; padding-left: 30px; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 8px;
            bottom: 8px;
            width: 2px;
            background: var(--tg-theme-hint-color, #ddd);
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
        }
        .timeline-item:last-child { padding-bottom: 0; }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -26px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--tg-theme-hint-color, #ddd);
            border: 2px solid var(--tg-theme-bg-color, #fff);
        }
        .timeline-item.active::before {
            background: #4caf50;
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
        }
        .timeline-item.current::before {
            background: var(--tg-theme-button-color, #2481cc);
            box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.2);
        }
        .status-name { font-weight: 600; margin-bottom: 4px; }
        .status-date { font-size: 13px; color: var(--tg-theme-hint-color, #999); }
        .error {
            display: none;
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }
        .error.show { display: block; }
        .not-found { text-align: center; padding: 40px; color: var(--tg-theme-hint-color, #999); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Отслеживание груза</h1>
            <p>Введите трек-номер, чтобы узнать статус</p>
        </div>

        <div class="search-box">
            <input type="text" id="trackInput" placeholder="Например: TJ001" maxlength="20">
            <button onclick="track()">Отследить</button>
        </div>

        <div class="error" id="error">Посылка не найдена. Проверьте номер.</div>

        <div class="result" id="result">
            <div class="track-code" id="rCode"></div>
            <div class="description" id="rDesc"></div>
            <div class="timeline" id="timeline"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram Mini App
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Подключение к Supabase (ваши ключи уже встроены!)
        const supabaseUrl = 'https://tlhsitnslofpunjkgycl.supabase.co';
        const supabaseKey = 'sb_publishable_gQdzylvYIMSSjam1AemmoQ_X844LaV9';
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);

        // Статусы с переводом
        const statusNames = {
            'registered': 'Оформлен',
            'purchased': 'Выкуплен в Китае',
            'shipped': 'Отправлен из Китая',
            'in_transit': 'В пути',
            'arrived': 'Прибыл в Таджикистан',
            'ready': 'Готов к выдаче',
            'delivered': 'Выдан'
        };
        const statusOrder = ['registered', 'purchased', 'shipped', 'in_transit', 'arrived', 'ready', 'delivered'];

        async function track() {
            const code = document.getElementById('trackInput').value.trim().toUpperCase();
            if (!code) return;

            // Показываем загрузку
            tg.MainButton.setText('Поиск...');
            tg.MainButton.show();

            // Ищем в базе
            const { data, error } = await supabase
                .from('parcels')
                .select('*')
                .eq('track_code', code)
                .single();

            tg.MainButton.hide();

            if (error || !data) {
                document.getElementById('error').classList.add('show');
                document.getElementById('result').classList.remove('show');
                return;
            }

            // Показываем результат
            document.getElementById('error').classList.remove('show');
            document.getElementById('result').classList.add('show');
            document.getElementById('rCode').textContent = data.track_code;
            document.getElementById('rDesc').textContent = data.description || '';

            // Рисуем таймлайн
            const currentIndex = statusOrder.indexOf(data.status);
            const timeline = document.getElementById('timeline');
            timeline.innerHTML = '';

            statusOrder.forEach((status, index) => {
                const item = document.createElement('div');
                item.className = 'timeline-item';
                if (index < currentIndex) item.classList.add('active');
                if (index === currentIndex) item.classList.add('current');
                if (index > currentIndex) item.style.opacity = '0.4';

                const date = index === currentIndex 
                    ? new Date(data.updated_at).toLocaleString('ru-RU')
                    : '';

                item.innerHTML = `
                    <div class="status-name">${statusNames[status]}</div>
                    <div class="status-date">${date}</div>
                `;
                timeline.appendChild(item);
            });

            // Показываем кнопку "Поделиться" внизу
            tg.MainButton.setText('Скопировать результат');
            tg.MainButton.onClick(() => {
                tg.sendData(JSON.stringify({code: data.track_code, status: statusNames[data.status]}));
            });
            tg.MainButton.show();
        }

        // Отслеживание по Enter
        document.getElementById('trackInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') track();
        });
    </script>
</body>
</html>
